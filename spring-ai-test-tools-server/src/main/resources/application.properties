spring.application.name=cassette-server

# The documented CLI flags (--port, --storage-dir, --admin-token, --client-token,
# --default-mode).
server.port=${port:9090}
cassette.storage-dir=${storage-dir:cassettes}
cassette.admin-token=${admin-token:}
cassette.client-token=${client-token:}
cassette.default-mode=${default-mode:RECORD_OR_REPLAY}

# Health only. Nothing else from actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.main.banner-mode=off

# No form endpoints here. Left on, FormContentFilter swallows the body of a PUT sent as
# application/x-www-form-urlencoded (curl's default for --data-binary), and a perfectly
# good fixture is refused as "not a JSON object".
spring.mvc.formcontent.filter.enabled=false
